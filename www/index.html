<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0"
  >
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#06060e">
  <title>SmashPad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="./main.css">
</head>
<body>
  <div id="setup">
    <canvas id="bgCanvas"></canvas>
    <div class="scan-lines"></div>

    <div class="setup-content">
      <div class="logo-wrap">
        <div class="logo-eyebrow">[ QR READY ]</div>
        <div class="logo">SMASH<span>PAD</span></div>
        <div class="logo-sub">ESCANEA, ELIGE JUGADOR Y EMPIEZA</div>
      </div>

      <div class="connection-pill" id="connectionHint">
        Servidor detectado: <span id="serverAddress">--</span>
      </div>

      <div class="section-label">// TOCA TU JUGADOR</div>
      <div class="player-cards" role="radiogroup" aria-label="Seleccion de jugador">
        <button class="player-card selected" data-player="1" type="button">
          <div class="card-glow"></div>
          <div class="card-num">P1</div>
          <div class="card-text">Rojo</div>
          <div class="card-bar"></div>
        </button>
        <button class="player-card" data-player="2" type="button">
          <div class="card-glow"></div>
          <div class="card-num">P2</div>
          <div class="card-text">Azul</div>
          <div class="card-bar"></div>
        </button>
        <button class="player-card" data-player="3" type="button">
          <div class="card-glow"></div>
          <div class="card-num">P3</div>
          <div class="card-text">Amarillo</div>
          <div class="card-bar"></div>
        </button>
        <button class="player-card" data-player="4" type="button">
          <div class="card-glow"></div>
          <div class="card-num">P4</div>
          <div class="card-text">Verde</div>
          <div class="card-bar"></div>
        </button>
      </div>

      <p class="setup-copy" id="setupCopy">
        Al tocar una tarjeta te conectas automaticamente. No hace falta escribir IP.
      </p>

      <div class="setup-actions">
        <a class="qr-hint" href="./pair.html" target="_blank" rel="noopener noreferrer">
          Abrir pantalla QR
        </a>
      </div>
    </div>
  </div>

  <div id="controller">
    <div id="statusBar">
      <span id="statusText">Desconectado</span>
      <div class="status-actions">
        <button class="mini-btn" id="gyroBtn" type="button">Gyro OFF</button>
        <button class="mini-btn" id="gyroCenterBtn" type="button">Centrar gyro</button>
        <button class="mini-btn" id="fullscreenBtn" type="button">Pantalla completa</button>
        <button class="mini-btn" id="resetBtn" type="button">Cambiar jugador</button>
      </div>
    </div>

    <div class="shoulder-row">
      <button class="trigger" data-btn="L" data-side="left" type="button">L</button>
      <button class="z-btn" data-btn="Z" type="button">Z</button>
      <button class="trigger" data-btn="R" data-side="right" type="button">R</button>
    </div>

    <div class="controls-grid">
      <div class="left-zone">
        <div class="zone-label">MOVIMIENTO</div>
        <div class="stick-area" id="joystick">
          <div class="stick-knob" id="stickHandle">
            <div class="stick-knob__cap"></div>
          </div>
        </div>
        <div class="gyro-copy" id="gyroCopy">Puedes usar el stick o activar el gyro.</div>
      </div>

      <button class="start-btn" data-btn="START" type="button">START</button>

      <div class="right-zone">
        <div class="zone-label zone-label-right">ATAQUES</div>
        <div class="face-buttons">
          <button class="face-btn" id="a-btn" data-btn="A" type="button">A</button>
          <button class="face-btn" id="b-btn" data-btn="B" type="button">B</button>
          <button class="face-btn" id="x-btn" data-btn="X" type="button">X</button>
          <button class="face-btn" id="y-btn" data-btn="Y" type="button">Y</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
  <script>
    (function() {
      const canvas = document.getElementById('bgCanvas');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      let width = 0;
      let height = 0;
      const dots = Array.from({ length: 60 }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        r: Math.random() * 1.5 + 0.4,
        hue: [267, 192, 0, 145][Math.floor(Math.random() * 4)],
        a: Math.random() * 0.35 + 0.08
      }));

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = 'rgba(255,255,255,0.022)';
        ctx.lineWidth = 1;

        for (let x = 0; x < width; x += 56) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }

        for (let y = 0; y < height; y += 56) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }

        dots.forEach((dot) => {
          dot.x += dot.vx;
          dot.y += dot.vy;
          if (dot.x < 0 || dot.x > width) dot.vx *= -1;
          if (dot.y < 0 || dot.y > height) dot.vy *= -1;

          ctx.beginPath();
          ctx.arc(dot.x, dot.y, dot.r, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${dot.hue},80%,60%,${dot.a})`;
          ctx.fill();
        });

        requestAnimationFrame(draw);
      }

      resize();
      window.addEventListener('resize', resize);
      draw();
    })();
  </script>
</body>
</html>
